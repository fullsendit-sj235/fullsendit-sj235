<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Saksham Joshi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B18"/>
      <stop offset="0.55" stop-color="#0E1630"/>
      <stop offset="1" stop-color="#1A1235"/>
    </linearGradient>
    <radialGradient id="glowWarm" cx="0.86" cy="0.12" r="0.55">
      <stop offset="0" stop-color="#FF7A45" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FF7A45" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCool" cx="0.06" cy="1" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#F5B14C"/>
      <stop offset="1" stop-color="#FF7A45"/>
    </linearGradient>
    <linearGradient id="fadeMask" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.38" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="waveMask"><rect width="1200" height="320" fill="url(#fadeMask)"/></mask>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
    <style>
      .hello { font: 500 18px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #F5B14C; }
      .name  { font: 700 66px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #F5F7FB; letter-spacing: -1.5px; }
      .sub   { font: 400 22px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #A9B4C8; }
      .handle{ font: 400 14px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #6B7A93; }
      .fade  { opacity: 0; animation: up 0.9s cubic-bezier(.2,.7,.2,1) forwards; }
      .d1 { animation-delay: .10s; } .d2 { animation-delay: .30s; }
      .d3 { animation-delay: .55s; } .d4 { animation-delay: .80s; }
      @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      .wave  { fill: none; stroke: url(#line); stroke-width: 1.6; stroke-linecap: round;
               stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 2.6s cubic-bezier(.3,.6,.2,1) forwards; }
      .w2 { animation-delay: .15s; } .w3 { animation-delay: .3s; } .w4 { animation-delay: .45s; }
      .w5 { animation-delay: .6s; }  .w6 { animation-delay: .75s; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .p2 { animation-delay: .8s; } .p3 { animation-delay: 1.6s; }
      @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.6); } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <rect width="1200" height="320" fill="url(#glowWarm)"/>
    <rect width="1200" height="320" fill="url(#glowCool)"/>

    <!-- contour lines -->
    <g mask="url(#waveMask)">
      <path class="wave"    stroke-opacity="0.95" d="M380 268 C 560 200, 700 300, 860 214 S 1080 110, 1230 168"/>
      <path class="wave w2" stroke-opacity="0.75" d="M380 246 C 560 178, 700 276, 860 190 S 1080 88, 1230 144"/>
      <path class="wave w3" stroke-opacity="0.58" d="M380 224 C 560 156, 700 252, 860 166 S 1080 66, 1230 120"/>
      <path class="wave w4" stroke-opacity="0.42" d="M380 202 C 560 134, 700 228, 860 142 S 1080 44, 1230 96"/>
      <path class="wave w5" stroke-opacity="0.28" d="M380 180 C 560 112, 700 204, 860 118 S 1080 22, 1230 72"/>
      <path class="wave w6" stroke-opacity="0.16" d="M380 158 C 560 90, 700 180, 860 94 S 1080 0, 1230 48"/>
    </g>
    <circle class="pulse"    cx="860"  cy="214" r="4" fill="#F5B14C"/>
    <circle class="pulse p2" cx="1012" cy="122" r="4" fill="#FF7A45"/>
    <circle class="pulse p3" cx="1112" cy="134" r="3" fill="#FF9A6B"/>

    <!-- text -->
    <text class="hello fade d1" x="72" y="108">&gt; hi, i'm</text>
    <rect class="cursor" x="174" y="93" width="10" height="19" fill="#F5B14C"/>
    <text class="name fade d2" x="68" y="182">Saksham Joshi</text>
    <text class="sub fade d3" x="72" y="228">CS student · ML &amp; data · building software that ships</text>
    <text class="handle fade d4" x="72" y="270">github.com/fullsendit-sj235</text>

    <rect y="317" width="1200" height="3" fill="url(#line)" opacity="0.9"/>
  </g>
</svg>
