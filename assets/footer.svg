<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-label="Thanks for stopping by">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#F5B14C"/>
      <stop offset="0.8" stop-color="#FF7A45"/>
      <stop offset="1" stop-color="#FF7A45" stop-opacity="0"/>
    </linearGradient>
    <style>
      .t { font: 400 14px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #8B98AE; letter-spacing: 1px; }
      .w { fill: none; stroke: url(#line); stroke-width: 1.5; stroke-dasharray: 1300; stroke-dashoffset: 1300; animation: d 2.4s ease-out forwards; }
      .w2 { animation-delay: .25s; }
      @keyframes d { to { stroke-dashoffset: 0; } }
    </style>
  </defs>
  <path class="w" stroke-opacity="0.9" d="M0 30 C 200 10, 400 50, 600 30 S 1000 10, 1200 30"/>
  <path class="w w2" stroke-opacity="0.4" d="M0 40 C 200 20, 400 60, 600 40 S 1000 20, 1200 40"/>
  <text class="t" x="600" y="78" text-anchor="middle">thanks for stopping by</text>
</svg>
