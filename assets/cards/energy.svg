<svg xmlns="http://www.w3.org/2000/svg" width="460" height="196" viewBox="0 0 460 196" role="img" aria-label="Home Energy Dashboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1124"/>
      <stop offset="1" stop-color="#121A33"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="0.75">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><rect width="460" height="196" rx="14"/></clipPath>
    <style>
      .title { font: 600 21px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #F5F7FB; letter-spacing: -0.3px; }
      .repo  { font: 400 12px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #6B7A93; }
      .desc  { font: 400 14.5px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #A9B4C8; }
      .stack { font: 500 12.5px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #C9D2E3; }
      .pill  { font: 500 12px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #22C55E; }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="460" height="196" fill="url(#bg)"/>
    <rect width="460" height="196" fill="url(#glow)"/>
    <rect width="4" height="196" fill="#22C55E"/>
    <text x="24" y="44" class="title">Home Energy Dashboard</text>
    <text x="24" y="66" class="repo">Website</text>
    <rect x="391.8" y="27" width="44.2" height="24" rx="12" fill="#22C55E" fill-opacity="0.12" stroke="#22C55E" stroke-opacity="0.45"/>
    <text x="413.9" y="43.5" text-anchor="middle" class="pill">Web</text>
    <text x="24" y="106" class="desc">React dashboard for household energy:</text>
    <text x="24" y="127" class="desc">consumption, carbon footprint, solar</text>
    <text x="24" y="148" class="desc">sizing and renewable energy mix.</text>
    <line x1="24" y1="158" x2="436" y2="158" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <circle cx="30" cy="177" r="5" fill="#22C55E"/>
    <text x="43" y="181.5" class="stack">TypeScript · React · Tailwind</text>
  </g>
  <rect x="0.5" y="0.5" width="459" height="195" rx="13.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.09"/>
</svg>
