<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="brachify capstone project, in progress">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B18"/>
      <stop offset="0.6" stop-color="#0E1630"/>
      <stop offset="1" stop-color="#10204A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#60A5FA" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0.10"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="c"><rect width="1200" height="260" rx="20"/></clipPath>
    <style>
      .eyebrow { font: 500 16px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #60A5FA; letter-spacing: 1px; }
      .title   { font: 700 60px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #F5F7FB; letter-spacing: -1.5px; }
      .sub     { font: 400 21px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #A9B4C8; }
      .pill    { font: 500 13px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #F5B14C; }
      .fade { opacity: 0; animation: up .9s cubic-bezier(.2,.7,.2,1) forwards; }
      .d1 { animation-delay: .1s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .5s; } .d4 { animation-delay: .7s; }
      @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .ch { stroke: #93C5FD; stroke-width: 1.4; stroke-opacity: .55; stroke-dasharray: 160; stroke-dashoffset: 160; animation: draw 1.8s ease-out forwards; }
      .c2 { animation-delay: .2s; } .c3 { animation-delay: .4s; } .c4 { animation-delay: .6s; } .c5 { animation-delay: .8s; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .dot { animation: pulse 2.2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#dots)"/>
    <rect width="1200" height="260" fill="url(#glow)"/>

    <!-- stylised applicator cylinder with channels -->
    <g transform="translate(940 34)">
      <path d="M0 40 A60 22 0 0 1 120 40 L120 196 A60 22 0 0 1 0 196 Z" fill="url(#cyl)" stroke="#60A5FA" stroke-opacity=".6" stroke-width="1.5"/>
      <ellipse cx="60" cy="40" rx="60" ry="22" fill="#60A5FA" fill-opacity=".12" stroke="#60A5FA" stroke-opacity=".7" stroke-width="1.5"/>
      <path class="ch"    d="M30 44 L28 196"/>
      <path class="ch c2" d="M48 36 L46 200"/>
      <path class="ch c3" d="M60 48 L60 204"/>
      <path class="ch c4" d="M74 36 L76 200"/>
      <path class="ch c5" d="M90 44 L92 196"/>
      <circle cx="30" cy="44" r="3" fill="#93C5FD"/>
      <circle cx="48" cy="36" r="3" fill="#93C5FD"/>
      <circle cx="60" cy="48" r="3" fill="#93C5FD"/>
      <circle cx="74" cy="36" r="3" fill="#93C5FD"/>
      <circle cx="90" cy="44" r="3" fill="#93C5FD"/>
    </g>

    <text class="eyebrow fade d1" x="72" y="78">CAPSTONE PROJECT · COSC 499</text>
    <text class="title fade d2" x="68" y="146">brachify</text>
    <text class="sub fade d3" x="72" y="188">3D-printable brachytherapy applicators from DICOM treatment plans</text>
    <g class="fade d4">
      <rect x="72" y="208" width="132" height="28" rx="14" fill="#F5B14C" fill-opacity=".12" stroke="#F5B14C" stroke-opacity=".5"/>
      <circle class="dot" cx="90" cy="222" r="4" fill="#F5B14C"/>
      <text class="pill" x="102" y="226.5">in progress</text>
    </g>
    <rect y="257" width="1200" height="3" fill="url(#line)" opacity=".9"/>
  </g>
</svg>
